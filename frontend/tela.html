<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-cache" />
    <title>DevCursos+ | Redirecionando</title>
  </head>
  <body>
    <p>Redirecionando para o ambiente de aprendizagem.</p>
    <script>
      const params = new URLSearchParams(location.search);
      const course = params.get("curso");
      const lesson = params.get("aula");
      const destination = course
        ? `cursos.html?curso=${encodeURIComponent(course)}${
            lesson ? `&aula=${encodeURIComponent(lesson)}` : ""
          }`
        : "catalogo.html";
      location.replace(destination);
    </script>
  </body>
</html>
