<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Área de estudo do curso selecionado." />
    <title>Estudar | DevCursos+</title>
    <link rel="stylesheet" href="design.css" />
  </head>
  <body class="study-site">
    <header class="study-header">
      <a class="wordmark" href="menudashbord.html"
        ><span class="wordmark-mark">D</span
        ><span>devcursos<span class="wordmark-plus">+</span></span></a
      ><a class="study-back" id="backLink" href="menudashbord.html"
        >Meu espaço</a
      >
      <div class="study-course-name" id="tituloCurso">Carregando curso</div>
      <div class="study-progress-copy" id="textoProg">
        Preparando o conteúdo
      </div>
    </header>
    <div class="study-layout">
      <aside class="curriculum-panel">
        <div class="curriculum-head">
          <span class="section-kicker">CURRÍCULO</span>
          <h2 id="curriculumTitle">Conteúdo do curso</h2>
          <div class="curriculum-count">
            <span id="curriculumCount">Carregando aulas</span>
          </div>
        </div>
        <nav
          id="menu"
          class="curriculum-list"
          aria-label="Aulas do curso"
        ></nav>
      </aside>
      <main class="lesson-main">
        <div class="lesson-loading" id="pagina" aria-live="polite">
          <div class="detail-skeleton">
            <span class="skeleton-line short"></span
            ><span class="skeleton-line wide"></span
            ><span class="skeleton-line medium"></span
            ><span class="skeleton-block"></span>
          </div>
        </div>
      </main>
    </div>
    <div class="study-footer">
      <span>DEV CURSOS+ / ESPAÇO DE ESTUDO</span
      ><button type="button" id="btnReiniciar" class="study-reset">
        Reiniciar meu progresso
      </button>
    </div>
    <script type="module" src="cursos.js"></script>
  </body>
</html>
