<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Formações que você guardou para estudar depois." />
    <title>Cursos salvos | DevCursos+</title>
    <link rel="stylesheet" href="design.css" />
  </head>
  <body class="app-site">
    <header class="app-header" data-header>
      <a class="wordmark" href="index.html">
        <span class="wordmark-mark">D</span>
        <span>devcursos<span class="wordmark-plus">+</span></span>
      </a>
      <nav class="app-nav" aria-label="Navegação do estudante">
        <a href="menudashbord.html">Visão geral</a>
        <a href="salvos.html" aria-current="page">Salvos</a>
        <a href="catalogo.html">Formações</a>
      </nav>
      <div class="app-account">
        <span id="userName">Minha conta</span>
        <button type="button" id="logoutBtn" class="text-link">Sair</button>
      </div>
    </header>
    <main class="dashboard saved-page">
      <section class="dashboard-welcome">
        <h1 id="savedTitle">Cursos <span>salvos</span></h1>
      </section>
      <section class="dashboard-catalog" aria-labelledby="savedTitle">
        <div class="section-heading">
          <a class="underlined-link" href="catalogo.html">Explorar formações</a>
        </div>
        <div class="catalog-grid saved-course-grid" id="savedCourses" aria-live="polite">
          <article class="course-card skeleton-card" aria-hidden="true">
            <span class="skeleton-line short"></span>
            <span class="skeleton-line wide"></span>
            <span class="skeleton-line medium"></span>
          </article>
        </div>
        <p id="savedStatus" class="catalog-status" role="status"></p>
      </section>
    </main>
    <footer class="app-footer">
      <span>DevCursos+</span>
      <a href="menudashbord.html">Voltar ao meu espaço</a>
    </footer>
    <script type="module" src="salvos.js"></script>
  </body>
</html>
