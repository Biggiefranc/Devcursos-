<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DevCursos+ | Cadastro</title>

    <link rel="stylesheet" href="login.css">

</head>

<body>

    <main class="login-page">

        <section class="login-card">

            <div class="logo">

                <div class="logo-icon">
                    🎓
                </div>

                <span>
                    DevCursos<span>+</span>
                </span>

            </div>


            <h1>Criar conta</h1>

            <p class="subtitle">
                Cadastre-se para começar sua jornada de aprendizado.
            </p>


            <form id="cadastroForm">

                <div class="form-group">

                    <label for="nome">
                        Nome
                    </label>

                    <div class="input-wrapper">

                        <input
                            type="text"
                            id="nome"
                            placeholder="Seu nome"
                            required
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <div class="input-wrapper">

                        <input
                            type="email"
                            id="email"
                            placeholder="seu@email.com"
                            required
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label for="senha">
                        Senha
                    </label>

                    <div class="input-wrapper">

                        <input
                            type="password"
                            id="senha"
                            placeholder="Digite sua senha"
                            required
                        >

                    </div>

                </div>


                <p
                    class="login-error"
                    id="cadastroMensagem"
                ></p>


                <button
                    type="submit"
                    class="login-button"
                >
                    Criar conta
                </button>

            </form>


            <div class="login-links">

                <a href="login.html">
                    Já tenho uma conta
                </a>

            </div>

        </section>

    </main>


    <script src="cadastro.js"></script>

</body>
</html>
