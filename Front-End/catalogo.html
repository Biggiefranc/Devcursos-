<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cursos disponíveis | Dev Cursos+</title>
<style>
:root{
  --bg:#400b94d0; --text:#f5f0ff; --muted:#cdbdf0;
  --purple:#c79bff; --card:#2a0866; --border:#6a3fc0; --hover:#ffffff22;
}
*,*::before,*::after{box-sizing:border-box}
html{background:#1a0540}
body{
  margin:0; min-height:100vh; color:var(--text);
  font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg);
}
a:focus-visible{outline:3px solid var(--purple); outline-offset:3px}

/* Barra superior */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  height:72px; padding:0 32px; border-bottom:1px solid var(--border);
}
.brand{
  display:flex; align-items:center; gap:12px;
  font-size:1.6rem; font-weight:700; text-decoration:none; color:var(--text);
}
.brand .name span{color:var(--purple)}
.logo{width:42px; height:38px}
.back{color:#9fd0ff; text-decoration:none; font-weight:600}
.back:hover{text-decoration:underline}

/* Conteúdo */
main{max-width:1000px; padding:48px 32px; margin:0 auto}
h1{font-size:2.2rem; margin:0 0 8px}
.sub{color:var(--muted); font-size:1.1rem; margin:0 0 36px}

.grade{display:grid; gap:24px}

/* Card do curso (o card inteiro é clicável) */
.card{
  display:grid; grid-template-columns:120px 1fr; gap:28px;
  background:var(--card); border:1px solid var(--border); border-radius:14px;
  padding:28px; color:var(--text); text-decoration:none;
  transition:border-color .2s, transform .2s;
}
.card:hover{border-color:var(--purple); transform:translateY(-3px)}
.icone{
  width:120px; height:120px; border-radius:22px;
  background:linear-gradient(135deg,#3b7bbf 50%,#f7d046 50%);
  display:grid; place-items:center;
  font-size:2.6rem; font-weight:800; color:#fff;
  text-shadow:0 2px 6px rgba(0,0,0,.35);
}
.card h2{margin:0 0 6px; font-size:1.6rem}
.card .desc{margin:0 0 16px; color:var(--muted); line-height:1.6}
.info{display:flex; flex-wrap:wrap; gap:8px 18px; margin:0 0 18px; font-size:.95rem; color:var(--muted)}
.modulos-titulo{margin:0 0 8px; font-size:1rem; font-weight:700}
.modulos{margin:0 0 22px; padding-left:22px; line-height:1.8}
.modulos li::marker{color:var(--purple); font-weight:700}
.botao{
  display:inline-block; background:#7a1fff; color:#fff;
  padding:12px 26px; border-radius:8px; font-weight:700;
}
.card:hover .botao{background:#9340ff}

@media (max-width:700px){
  .card{grid-template-columns:1fr}
  .icone{width:90px; height:90px; font-size:2rem}
}
</style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="prototipo.html">
    <svg class="logo" viewBox="0 0 48 44" aria-hidden="true">
      <rect x="2" y="2" width="44" height="30" rx="5" fill="#7a1fff" stroke="#b98aff" stroke-width="1.5"/>
      <rect x="20" y="32" width="8" height="6" fill="#7a1fff"/>
      <rect x="12" y="38" width="24" height="4" rx="2" fill="#7a1fff"/>
      <g fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 10.5 12 17l7 6.5"/><path d="M26.5 9.5 21.5 24.5"/><path d="M29 10.5 36 17l-7 6.5"/>
      </g>
    </svg>
    <span class="name">Dev <span>Cursos</span>+</span>
  </a>
  <a class="back" href="prototipo.html">← Início</a>
</header>

<main>
  <h1>Cursos disponíveis</h1>
  <p class="sub">Escolha um curso para começar a estudar.</p>

<div class="grade" id="cursosContainer" aria-live="polite">
    <p>Carregando cursos...</p>
</div>
</main>

<script src="auth.js" defer></script>
<script src="catalogo.js" defer></script>
</body>
</html>
