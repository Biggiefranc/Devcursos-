<!doctype html>
<html lang="pt-BR">

<head>
  <script>try { document.documentElement.dataset.tema = localStorage.getItem('devcursos-tema') || 'escuro'; } catch (e) { }</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevCursos+ | Visualizar curso</title>
  <link rel="stylesheet" href="tema.css">
  <style>
    :root {
      --detail-shell: rgba(31, 23, 52, 0.9);
      --detail-panel: rgba(22, 17, 36, 0.9);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(900px 420px at 80% 0%, rgba(167, 123, 255, 0.14), transparent 66%) no-repeat top,
        var(--bg);
      color: var(--text);
      font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
    }

    a { color: inherit; text-decoration: none; }

    .topbar {
      height: 68px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow-top);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .brand span { color: var(--purple); }

    .top-link {
      color: var(--link);
      font-weight: 700;
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid var(--border-2);
      background: var(--surface-2);
    }

    .account {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text);
      font-weight: 700;
    }

    .account a {
      color: var(--link);
      font-weight: 700;
    }

    .avatar {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--purple);
      color: var(--bg);
      font-weight: 800;
    }

    .detail-layout {
      max-width: 1200px;
      margin: 28px auto 60px;
      padding: 0 20px;
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(260px, 1fr);
      gap: 24px;
      align-items: start;
    }

    .detail-main,
    .progress-panel {
      background: var(--detail-shell);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: var(--shadow);
    }

    .detail-main {
      padding: 22px;
    }

    .detail-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }

    .text-button {
      color: var(--link);
      font-weight: 700;
    }

    .favorite {
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--border-2);
      background: var(--surface-2);
      color: var(--text);
      font-weight: 700;
      cursor: pointer;
    }

    .favorite.active {
      background: rgba(224, 104, 107, 0.12);
      color: var(--red);
      border-color: rgba(224, 104, 107, 0.24);
    }

    .course-hero {
      display: grid;
      grid-template-columns: 120px minmax(0,1fr);
      gap: 20px;
      align-items: center;
      margin-bottom: 18px;
      padding: 8px 0 14px;
    }

    .course-art {
      display: grid;
      place-items: center;
      min-height: 120px;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(167, 123, 255, 0.18), rgba(79, 211, 100, 0.12));
      border: 1px solid var(--border);
    }

    .course-art svg {
      width: 80px;
      height: 80px;
      color: var(--purple);
    }

    .muted {
      margin: 0 0 6px;
      color: var(--muted);
      font-weight: 700;
      text-transform: capitalize;
    }

    .course-hero h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 4vw, 3rem);
      letter-spacing: -0.05em;
      line-height: 1.08;
    }

    .course-hero p {
      margin: 0 0 8px;
      color: var(--text-2);
      line-height: 1.6;
    }

    .module-heading {
      margin: 24px 0 16px;
      font-size: 1.1rem;
      letter-spacing: -0.04em;
    }

    .module {
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgba(255,255,255,0.015);
      overflow: hidden;
    }

    .module + .module { margin-top: 12px; }

    .module-toggle {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border: 0;
      background: transparent;
      color: var(--text);
      font: inherit;
      text-align: left;
      padding: 16px 18px;
      cursor: pointer;
      font-weight: 700;
    }

    .lesson-list {
      display: none;
      padding: 0 18px 18px;
    }

    .module.open .lesson-list { display: block; }

    .lesson {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      margin-top: 8px;
      border-radius: 12px;
      background: rgba(255,255,255,0.02);
      color: var(--text-2);
      border: 1px solid transparent;
    }

    .lesson.completed {
      background: rgba(79, 211, 100, 0.08);
      border-color: rgba(79, 211, 100, 0.22);
      color: var(--text);
    }

    .primary-button,
    .login-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 18px;
      border-radius: 12px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--purple), var(--accent));
      color: #fff;
      box-shadow: 0 12px 28px rgba(122, 31, 255, 0.2);
    }

    .login-button {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border-2);
      box-shadow: none;
    }

    .enroll-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
    }

    .small-note {
      color: var(--muted);
      margin: 0;
      font-size: 0.92rem;
    }

    .progress-panel {
      padding: 22px 18px;
      background: var(--detail-panel);
    }

    .progress-panel h3 {
      margin: 0 0 10px;
      font-size: 1rem;
      letter-spacing: -0.04em;
    }

    .progress-number {
      font-size: 2.1rem;
      font-weight: 800;
      letter-spacing: -0.06em;
      color: var(--purple);
      margin-bottom: 8px;
    }

    .progress-track {
      height: 10px;
      border-radius: 999px;
      overflow: hidden;
      background: var(--track);
      border: 1px solid rgba(255,255,255,0.04);
      margin-bottom: 10px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--purple), var(--green));
      border-radius: inherit;
    }

    .notice {
      padding: 18px 20px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgba(255,255,255,0.02);
      color: var(--text-2);
    }

    .notice a { color: var(--link); }

    @media (max-width: 915px) {
      .detail-layout { grid-template-columns: 1fr; }
      .course-hero { grid-template-columns: 90px minmax(0,1fr); }
    }

    @media (max-width: 640px) {
      .topbar { padding: 0 16px; }
      .detail-layout { padding: 0 16px; }
      .detail-main { padding: 18px; }
      .detail-actions { flex-wrap: wrap; }
      .course-hero { grid-template-columns: 1fr; }
      .account { gap: 8px; }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <a class="brand" href="menudashbord.html">Dev<span>Cursos</span>+</a>
    <a class="top-link" href="menudashbord.html">Catálogo</a>
    <div class="account"><a href="login.html" id="accountLink">Entrar</a><span class="avatar"
        aria-hidden="true">♙</span></div>
  </header>
  <main>
    <div class="detail-layout" id="courseDetail">
      <p class="notice">Carregando curso...</p>
    </div>
  </main>
  <script type="module" src="visualizarcurso.js"></script>
  <script type="module" src="tema.js"></script>
</body>

</html>
