<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevCursos+ | Cursos</title>
  <link rel="stylesheet" href="tema.css">
  <link rel="stylesheet" href="cursos.css">
</head>

<body>
  <div class="page-shell">
    <aside class="sidebar">
      <div class="sidebar-top">
        <a class="brand" id="brandLink" href="menudashbord.html">DevCursos<span>+</span></a>
        <a class="back" id="backLink" href="menudashbord.html">← Voltar</a>
      </div>

      <div class="course-card">
        <span class="eyebrow">Curso atual</span>
        <h1 id="tituloCurso">Carregando curso...</h1>
      </div>

      <nav id="menu" class="menu" aria-label="Menu do curso"></nav>
    </aside>

    <main class="main-panel">
      <header class="topbar">
        <div class="topbar-copy">
          <span class="chip">Aulas</span>
          <strong id="textoProg">0 de 0 concluídas</strong>
        </div>
        <div class="progress-bar" aria-label="Progresso do curso">
          <span id="barraProg"></span>
        </div>
      </header>

      <div class="page-content">
        <div id="pagina" class="course-page"></div>
      </div>

      <div class="toolbar">
        <button type="button" id="btnReiniciar" class="reset-btn">Reiniciar progresso</button>
      </div>
    </main>
  </div>

  <script type="module" src="tema.js"></script>
  <script type="module" src="auth.js"></script>
  <script type="module" src="cursos.js"></script>
</body>

</html>
